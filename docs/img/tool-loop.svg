<text x="730.0" y="619" font-size="11.5" fill="#ea580c" text-anchor="middle" font-weight="normal">9. agent.message</text>
<line x1="560" y1="682" x2="190" y2="682" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>
