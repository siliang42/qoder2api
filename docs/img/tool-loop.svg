<text x="30" y="44" font-size="18" fill="#0f172a" text-anchor="start" font-weight="700">工具调用回路（Codex / Claude 通用）</text>
<text x="30" y="68" font-size="12" fill="#475569" text-anchor="start" font-weight="normal">客户端请求里带 tools；桥把它们注册成云端 custom tool，再把 tool_use 回译给客户端执行</text>
